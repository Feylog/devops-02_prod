all:
  children:
    control_plane:
      hosts:
        control-plane:
          ansible_host: 51.250.8.28
    workers:
      hosts:
        worker-1:
          ansible_host: 10.10.0.32
          ansible_ssh_common_args: '-o ProxyCommand="ssh -i ~/.ssh/devops01 -o StrictHostKeyChecking=no -W %h:%p ubuntu@51.250.8.28" -o StrictHostKeyChecking=no'
        worker-2:
          ansible_host: 10.10.0.5
          ansible_ssh_common_args: '-o ProxyCommand="ssh -i ~/.ssh/devops01 -o StrictHostKeyChecking=no -W %h:%p ubuntu@51.250.8.28" -o StrictHostKeyChecking=no'
    kube_cluster:
      children:
        control_plane:
        workers:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/devops01
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
