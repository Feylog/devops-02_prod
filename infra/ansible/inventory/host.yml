all:
  children:
    control_plane:
      hosts:
        control-plane:
          ansible_host: 51.250.92.153
    workers:
      hosts:
        worker-1:
          ansible_host: 10.10.0.6
          ansible_ssh_common_args: '-o ProxyJump=ubuntu@51.250.92.153 -o StrictHostKeyChecking=no'
        worker-2:
          ansible_host: 10.10.0.14
          ansible_ssh_common_args: '-o ProxyJump=ubuntu@51.250.92.153 -o StrictHostKeyChecking=no'
    kube_cluster:
      children:
        control_plane:
        workers:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/devops01
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
