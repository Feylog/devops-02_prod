# Local development environment for the URL shortener.
# Spins up MySQL (port 3306) and Redis (port 6379) on the host.
#
# Usage:
#   docker compose up -d         # start in background
#   docker compose ps            # see status
#   docker compose logs -f mysql # tail mysql logs
#   docker compose down          # stop everything (volumes preserved)
#   docker compose down -v       # stop AND delete data volumes (NUKE)

services:
  mysql:
    image: mysql:8.4
    container_name: url-shortener-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: urlshort
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootsecret",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
