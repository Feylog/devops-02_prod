# GitLab CI pipeline for the URL shortener service.
#
# Stages run sequentially; jobs within a stage run in parallel.
# Phase 3b: build stage only. Test + deploy come in Phase 4.

stages:
  - build

variables:
  IMAGE_BASE: $CI_REGISTRY_IMAGE/url-shortener
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

# Build the FastAPI image and push two tags:
#   - <branch>-<short-sha>  : immutable, traces to one commit
#   - <branch>              : mutable, follows the branch tip
build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - cd app/fastapi
    - SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
    - BRANCH="${CI_COMMIT_REF_SLUG}"
    - IMMUTABLE_TAG="${IMAGE_BASE}:${BRANCH}-${SHORT_SHA}"
    - BRANCH_TAG="${IMAGE_BASE}:${BRANCH}"
    - echo "Building $IMMUTABLE_TAG"
    - docker build -t "$IMMUTABLE_TAG" -t "$BRANCH_TAG" .
    - docker push "$IMMUTABLE_TAG"
    - docker push "$BRANCH_TAG"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_TAG
